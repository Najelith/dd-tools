name: Build Windows Binaries

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile C Tools
      shell: cmd
      run: |
        mkdir build
        for %%f in (*.c) do (
            echo Compiling %%f...
            cl.exe /O2 /W3 /DPATH_MAX=MAX_PATH /D_CRT_SECURE_NO_WARNINGS %%f /Fe:build/%%~nf.exe
        )

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dd-tools-windows-x64
        path: build/*.exe
