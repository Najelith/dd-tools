name: Build, Tag, and Release Windows Binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile C Tools
      shell: cmd
      run: |
        mkdir bin
        for %%f in (*.c) do (
            echo Compiling %%f...
            cl.exe /O2 /W3 /DPATH_MAX=260 /D_CRT_SECURE_NO_WARNINGS %%f /Fe:bin/%%~nf.exe
        )

    - name: Zip Binaries
      shell: powershell
      run: |
        Compress-Archive -Path bin\*.exe -DestinationPath dd-tools-windows-x64.zip

    - name: Temporarily Store Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-zip-payload
        path: dd-tools-windows-x64.zip
        retention-days: 1

  tag-and-release:
    runs-on: ubuntu-latest
    needs: build # Ensures compilation finishes successfully before tagging
    permissions:
      contents: write # Crucial permission for tagging and release creation

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required by the tagging tool to see history

    - name: Auto-Increment and Create Tag
      id: create_tag
      uses: anothrNick/github-tag-action@1.71.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: true
        DEFAULT_BUMP: patch

    - name: Download Zip Artifact from Build Job
      uses: actions/download-artifact@v4
      with:
        name: windows-zip-payload

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        files: dd-tools-windows-x64.zip
        tag_name: ${{ steps.create_tag.outputs.new_tag }}
        name: Release ${{ steps.create_tag.outputs.new_tag }}
        draft: false
        prerelease: false
